name: CICD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: self-hosted
    permissions:
     contents: write       # Required to push code, create tags/releases
      
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Resolve Maven dependencies
      run: mvn -B -ntp dependency:resolve

    #- name: Build project
      #run: mvn -B -ntp verify -DskipTests

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    #- name: Update dependency graph
     # uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
  Security-check:
    runs-on: self-hosted
    needs: compile
    
    steps:
    - uses: actions/checkout@v4
    - name: Trivy installation
      run: |
       sudo apt-get install wget gnupg -y
       wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
       echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
       sudo apt-get update -y
       sudo apt-get install trivy -y
    # Trivy is an open-source, all-in-one security scanner by Aqua Security designed to detect known vulnerabilities (CVEs), 
    # Infrastructure-as-Code misconfigurations, hardcoded secrets, and software licenses across containers, filesystems, and Kubernetes clusters
       
    - name: Trivy FS Scan
      run: trivy fs --offline-scan --format json --output fs-report.json .  #offline scan coz giving mvn cache error
      #run: trivy fs --format json -o fs-report.json .
      # fs scan report will be generated in . (current folder) in shared runner 
      # but we cant access the report as we are using the shared runner 

    - name: Gitleaks Installation
      run: sudo apt install gitleaks -y
      # Gitleaks is an open-source static application security testing (SAST) tool used to find and prevent hardcoded secrets—such as 
      # passwords, API keys, and tokens—in git repositories, directories, files, and CI/CD pipelines

    - name: Gitleaks Code scan
      run: gitleaks detect source . -r gitleaks-report.json -f json

  Test:
    runs-on: self-hosted
    needs: Security-check
    #permissions:
     #contents: write       # Required to push code, create tags/releases
      
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Unit test cases
      run: mvn test

  build_project_and_sonar_scan:
    runs-on: self-hosted
    needs: Test
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build Project
      run: mvn package
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: app.jar
        path: target/*.jar

    - uses: actions/checkout@v7
      with:
        # Disabling shallow clones is recommended for improving the relevancy of reporting
        fetch-depth: 0
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v8.3.0 # Ex: v8.3.0, or sha1, See the latest version at https://github.com/marketplace/actions/official-sonarqube-scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        #SonarQube is a static code analysis platform that continuously inspects source code for bugs, 
        #security vulnerabilities, code smells, and technical debt

       # Check the Quality Gate status.
       #Quality Gates: Enforces pass-or-fail metrics on new code to block merging if quality standards are not met.
    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      uses: sonarsource/sonarqube-quality-gate-action@master
      with:
         pollingTimeoutSec: 600
      env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  build_docker_image_and_push:
    runs-on: self-hosted
    needs: build_project_and_sonar_scan
    steps:
    - uses: actions/checkout@v4
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with: 
       name: app-jar
       path: app # this will download JAR to ./app folder

    - name: Checkout
      uses: actions/checkout@v6
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        #context: .
       push: true
       tags: "nikhilgaikwad/bankapp:latest"
       file: ./Dockerfile

  deploy_to_kubernetes:
    runs-on: self-hosted
    needs: build_docker_image_and_push
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Install AWS CLI
      run: |
       curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o
       "awscliv2.zip"
       unzip awscliv2.zip
       sudo ./aws/install
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'
    - name: Configure Kubeconfig
      run: |
       mkdir -p $HOME/.kube
       echo "${{ secrets.EKS_KUBECONFIG }}" > $HOME/.kube/config
    - name: Deploy to EKS
      run: |
       kubectl apply -f ds.yml
    
       
